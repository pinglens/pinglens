name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/*.test.js

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint pinglens
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm dependency build charts/pinglens
          helm lint --strict charts/pinglens
      - name: Test pinglens-exporter
        run: sh charts/pinglens-exporter/tests/test.sh

  mixin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install jsonnet
        run: go install github.com/google/go-jsonnet/cmd/jsonnet@v0.21.0 github.com/google/go-jsonnet/cmd/jsonnetfmt@v0.21.0
      - run: sh mixin/test.sh