apiVersion: v2
name: pinglens
description: PingLens regional ping and MTR-style path testing service
# Released charts get version and appVersion from the release tag; on main
# they deploy the image built from main.
version: 0.0.0
appVersion: "main"
type: application
dependencies:
  - name: valkey
    version: "0.9.*"
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled,coordinator.enabled
