image:
  repository: ghcr.io/pinglens/pinglens
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion, the release the chart was built for.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

branding:
  appName: PingLens
  providerName: ""
  providerURL: ""
  providerLogoURL: ""
  # Optional UI palette overrides as hex colors (e.g. "#2563eb").
  # Empty values keep PingLens' built-in defaults.
  theme:
    accent: ""
    accentSecondary: ""
    background: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Annotations on the coordinator and agent Deployments themselves, for
# tools that read their settings from Deployment metadata.
annotations: {}
podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

agentSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - NET_RAW
    drop:
      - ALL

service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

metricsService:
  enabled: true
  type: ClusterIP
  port: 9090
  annotations: {}

agentService:
  enabled: false
  name: agent
  type: ClusterIP
  port: 8080
  annotations: {}
  externalTrafficPolicy: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

ingress:
  enabled: false
  className: ""
  labels: {}
  annotations: {}
  hosts: []
  tls: []

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
valkey:
  # enabled:
  auth:
    enabled: false
  dataStorage:
    enabled: false
  replica:
    enabled: false
    replicas: 1
    service:
      enabled: false
    persistence:
      size: ""

stateStore:
  url: ""
  sentinelAddrs: []
  sentinelMaster: myprimary
  prefix: pinglens
  passwordSecret:
    name: ""
    key: password

coordinator:
  enabled: true
  replicaCount: 1
  affinity: {}
  listen: ":8080"
  metricsListen: ":9090"
  regions: []
  pingCount: 0
  pingInterval: 1s
  pingTimeout: 3s
  jobDuration: 10m
  # Agents trace each job's target continuously: one probe per hop every
  # traceInterval, each waiting up to traceTimeout (below traceInterval), up
  # to traceMaxTTL hops (at most 31). The rolling hop table is reported every
  # traceReportInterval and kept with the job's events.
  traceInterval: 1s
  traceTimeout: 900ms
  traceMaxTTL: 30
  traceReportInterval: 5s
  globalCreateRateLimit: 120
  targetCreateRateLimit: 30
  clientCreateRateLimit: 20
  createRateWindow: 1m
  globalConcurrencyLimit: 100
  targetConcurrencyLimit: 25
  clientConcurrencyLimit: 10
  agentPollTimeout: 30s
  agentOnlineTimeout: 45s
  jobRetention: 15m
  maxQueuedJobsPerAgent: 16
  agentTokensSecret:
    name: ""
    key: agent-tokens

agent:
  enabled: false
  replicaCount: 1
  affinity: {}
  id: ""
  displayName: ""
  coordinatorURL: ""
  pollBackoff: 2s
  tokenSecret:
    name: ""
    key: token

  dnsPolicy: ""
  dnsConfig: {}

extraEnv: []
