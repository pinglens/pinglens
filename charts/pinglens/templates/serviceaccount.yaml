{{- if and .Values.serviceAccount.create (or .Values.coordinator.enabled .Values.agent.enabled) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pinglens.serviceAccountName" . }}
  labels:
    {{- include "pinglens.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
