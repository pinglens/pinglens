<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .AppName }}</title>
  {{- if .BrandLogoURL }}
  <link rel="icon" href="{{ .BrandLogoURL }}">
  {{- end }}
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  {{- with .Theme }}{{ if not .IsZero }}
  <style>
    :root {
      {{- if .Accent }} --accent: {{ .Accent }};{{ end }}
      {{- if .AccentSecondary }} --accent-2: {{ .AccentSecondary }};{{ end }}
      {{- if .Background }} --bg: {{ .Background }};{{ end }}
    }
  </style>
  {{- end }}{{ end }}
</head>
<body>
  <main class="shell">
    <section class="card hero">
      <h1 class="app-name">{{ .AppName }}</h1>
      <form id="probe-form" class="probe-form">
        <input id="target" name="target" autocomplete="off" spellcheck="false" placeholder="example.com or 203.0.113.10" aria-label="Target host or IP address" required>
        <button type="submit">Start test</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="card results-card">
      <div class="card-heading">
        <h2>Results</h2>
        <div class="job-actions">
          <button id="stop-job" class="secondary" type="button" hidden>Stop</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Region</th>
              <th>IP</th>
              <th>Status</th>
              <th>Chart</th>
              <th>Loss</th>
              <th>Min</th>
              <th>Avg</th>
              <th>Max</th>
              <th>MTR</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <span>{{ .AppName }}</span>
      {{- if and .BrandName .BrandURL }}
      <span class="footer-separator">•</span>
      <a class="brand-link" href="{{ .BrandURL }}" rel="noopener noreferrer" target="_blank">
        {{- if .BrandLogoURL }}<img class="brand-logo" src="{{ .BrandLogoURL }}" alt="" loading="lazy">{{ end -}}
        <span>{{ .BrandName }}</span>
      </a>
      {{- end }}
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
